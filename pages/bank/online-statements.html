<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Statements — Bank of America Online Banking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003580">
  <link rel="shortcut icon" href="../../downloaded_files/img/boa_box.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/home.css">
  <style>
    .skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999}
    .skip-link:focus{position:fixed;top:0;left:0;width:auto;height:auto;padding:.6rem 1.25rem;background:#003580;color:#fff;font-size:.9rem;font-weight:700;border-radius:0 0 6px 0;text-decoration:none;outline:3px solid #fff}
    *:focus-visible{outline:3px solid #005eb8;outline-offset:2px}
    a,button{touch-action:manipulation}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    .os-toolbar{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap}
    .os-stmt-row{display:flex;align-items:center;justify-content:space-between;
      padding:.9rem 1.25rem;border-bottom:1px solid #f0f0f0;gap:1rem;flex-wrap:wrap;
      transition:background-color .12s ease}
    .os-stmt-row:last-child{border-bottom:none}
    .os-stmt-row:hover{background:#f8f9fa}
    .os-stmt-info{display:flex;align-items:center;gap:.75rem}
    .os-stmt-icon{width:38px;height:38px;border-radius:8px;background:#ede9fe;color:#7c3aed;
      display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
    .os-stmt-name{font-size:.9rem;font-weight:700;color:#0a2540}
    .os-stmt-sub{font-size:.75rem;color:#888;margin-top:.1rem}
    .os-stmt-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="shell-wrap">

  <script>window.BOA_ROOT = '../../'; window.BOA_BANKING_TAB = 'online-statements';</script>
  <!-- data.js MUST load before navbar.js and onlineStatement.js -->
  <script src="../../js/data.js"></script>
  <script src="../../js/navbar.js"></script>

  <div class="shell-page-header">
    <div class="BOA-container shell-page-header__inner">
      <h1 class="shell-page-header__title">Online Statements</h1>
      <nav class="shell-breadcrumb" aria-label="Breadcrumb">
        <a href="../../index.html">Home</a>
        <span class="shell-breadcrumb__sep" aria-hidden="true"><i class="fa fa-chevron-right"></i></span>
        <a href="account-summary.html">Account Summary</a>
        <span class="shell-breadcrumb__sep" aria-hidden="true"><i class="fa fa-chevron-right"></i></span>
        <span>Statements</span>
      </nav>
    </div>
  </div>

  <main class="shell-content" id="main-content">
    <div class="BOA-container">

      <!-- Toolbar — dropdowns populated by onlineStatement.js from BOA_ACCOUNTS -->
      <div class="shell-card" style="margin-bottom:1.25rem">
        <div class="shell-card__body">
          <div class="os-toolbar">
            <div class="BOA-form-group" style="margin:0;min-width:260px">
              <label for="os_account" class="BOA-label">Account</label>
              <select id="os_account" class="BOA-select" aria-label="Select account">
                <!-- populated dynamically -->
              </select>
            </div>
            <div class="BOA-form-group" style="margin:0;min-width:150px">
              <label for="os_year" class="BOA-label">Year</label>
              <select id="os_year" class="BOA-select" aria-label="Select year">
                <!-- populated dynamically -->
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Statement list card -->
      <div class="shell-card">
        <div class="shell-card__head">
          <h2 class="shell-card__title" id="os_heading">Statements</h2>
          <span id="os_count" class="BOA-badge BOA-badge--info" aria-live="polite"></span>
        </div>
        <div id="os_list" aria-live="polite">
          <!-- populated by onlineStatement.js -->
        </div>
      </div>

    </div>
  </main>

  <!-- ── Statement detail view modal ── -->
  <div id="modal-stmt-view" class="BOA-modal-overlay" style="display:none"
    role="dialog" aria-modal="true" aria-labelledby="stmt_modal_title">
    <div class="BOA-modal BOA-modal--lg" style="max-width:760px">
      <div class="BOA-modal__header">
        <h3 class="BOA-modal__title" id="stmt_modal_title">
          <i class="fa fa-file-lines" aria-hidden="true" style="color:#7c3aed;margin-right:.4rem"></i>
          Statement Detail
        </h3>
        <button class="BOA-modal__close" onclick="closeModal('modal-stmt-view')" aria-label="Close statement">
          <i class="fa fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="BOA-modal__body" id="stmt_modal_body" style="padding:0;max-height:75vh;overflow-y:auto">
        <!-- populated by viewStatement() in onlineStatement.js -->
      </div>
      <div class="BOA-modal__footer">
        <button class="BOA-btn BOA-btn--secondary" onclick="closeModal('modal-stmt-view')">Close</button>
        <button class="BOA-btn BOA-btn--primary"
          onclick="if(window._stmtPrintAccId!=null)printStatement(window._stmtPrintAccId,window._stmtPrintYear,window._stmtPrintIdx)">
          <i class="fa fa-download" aria-hidden="true"></i> Download PDF
        </button>
      </div>
    </div>
  </div>

  <footer class="shell-footer">
    <div class="BOA-container shell-footer__inner">
      <ul class="shell-footer__links">
        <li><a href="../../index.html">Home</a></li>
        <li><a href="../../help.html">Help</a></li>
        <li><a href="../../privacy.html">Privacy</a></li>
        <li><a href="../../logout.html">Sign Out</a></li>
      </ul>
      <p class="shell-footer__copy">© 2026 Bank of America Corporation. FDIC Insured.</p>
    </div>
  </footer>

</div>

<script src="../../js/ui.js"></script>
<script src="../../js/checkAccess.js"></script>
<script src="../../js/onlineStatement.js"></script>
</body>
</html>
